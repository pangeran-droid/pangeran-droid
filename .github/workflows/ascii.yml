name: ASCII profile card

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: hu553in/ascii-profile-card@v1
        with:
          config: |
            card:
              lines:

                - { type: header, text: "pangeran droid" }


                - { type: kv, key: role, value: "informatics student" }

                - { type: kv, key: focus, value: "web development & learning" }


                - { type: blank }


                - { type: kv, key: stack.frontend, value: "html, css, javascript, bootstrap" }

                - { type: kv, key: stack.backend, value: "php, laravel, codeigniter" }

                - { type: kv, key: stack.language, value: "python, javascript" }

                - { type: kv, key: stack.tools, value: "linux, git, github, vscode" }


                - { type: kv, key: interests, value: "cyber security, open source, coding" }


                - { type: blank }


                - { type: section, title: contact }


                - { type: kv, key: github, value: "github.com/pangeran-droid" }

                - { type: kv, key: telegram, value: "t.me/pangeran1337" }


                - { type: blank }


                - { type: section, title: github stats }


                - { type: kv, key: repos, value: "{repos}" }

                - { type: kv, key: stars, value: "{stars}" }

                - { type: kv, key: followers, value: "{followers}" }

                - { type: kv, key: contributions, value: "{contributions} (all time)" }

                - { type: kv, key: lines of code, value: "{loc} ({locAdded}, {locDeleted})" }

                - { type: kv, key: top languages, value: "{topLanguages}" }