name: ASCII profile card

on:
  # run automatically
  schedule:
    - cron: '0 4 * * *'

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the main branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate ASCII Profile Card
        uses: hu553in/ascii-profile-card@v1

        with:
          token: ${{ secrets.ASCII_PROFILE_CARD_PAT }}
          branch: ascii-output

          config: |

            login: pangeran-droid

            uptimeStart: 2024-01-01


            card:

              lowercase: true


              lines:


                - { type: header, text: "pangeran@github:~$" }

                - { type: blank }

                - { type: section, title: about me }
                - { type: kv, key: name, value: "pangeran" }
                - { type: kv, key: role, value: "informatics student" }
                - { type: kv, key: focus, value: "web development & security researcher" }
                - { type: kv, key: mindset, value: "learn, build, break, improve" }
                - { type: kv, key: uptime, value: "{uptime}" }

                - { type: blank }

                - { type: section, title: tech stack }
                - { type: kv, key: frontend, value: "html, css, javascript" }
                - { type: kv, key: backend, value: "php, laravel, codeigniter" }
                - { type: kv, key: scripting, value: "python" }
                - { type: kv, key: database, value: "mysql" }
                - { type: kv, key: environment, value: "linux, git, github, vscode" }

                - { type: blank }

                - { type: section, title: interests }
                - { type: kv, key: security, value: "cyber security & ethical hacking" }
                - { type: kv, key: open_source, value: "building and learning" }
                - { type: kv, key: hobbies, value: "coding, experimenting, automation" }

                - { type: blank }

                - { type: section, title: contact }
                - { type: kv, key: github, value: "github.com/pangeran-droid" }
                - { type: kv, key: telegram, value: "t.me/pangeran1337" }

                - { type: blank }

                - { type: section, title: github stats }
                - { type: kv, key: repositories, value: "{repos}" }
                - { type: kv, key: stars, value: "{stars}" }
                - { type: kv, key: followers, value: "{followers}" }
                - { type: kv, key: commits, value: "{contributions}" }
                - { type: kv, key: code, value: "{loc} ({locAdded}+ / {locDeleted}-)" }
                - { type: kv, key: languages, value: "{topLanguages}" }
